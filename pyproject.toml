[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loom-harness"
version = "0.2.0"
description = "A local-first cognitive harness that turns sources into a typed, layered knowledge network for AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Loom contributors" }
]
keywords = [
  "ai-agents",
  "agent-skills",
  "cognitive-harness",
  "ai-knowledge-network",
  "knowledge-network",
  "knowledge-graph",
  "knowledge-base",
  "knowledge-management",
  "local-first",
  "personal-knowledge-management",
  "second-brain",
  "zettelkasten",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Database",
  "Topic :: Text Processing",
]
dependencies = [
  "certifi>=2023.0.0",
  "sqlite-vec>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/q8886b/loom-ai-knowledge-network"
Documentation = "https://github.com/q8886b/loom-ai-knowledge-network/blob/main/docs/quickstart.md"
Repository = "https://github.com/q8886b/loom-ai-knowledge-network"
Issues = "https://github.com/q8886b/loom-ai-knowledge-network/issues"

[project.optional-dependencies]
workbench = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
]
dev = [
  "pytest>=8",
]

[project.scripts]
loom = "loom.__main__:main"
loom-admin = "loom.__main__:admin_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
